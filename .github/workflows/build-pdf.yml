name: Build PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pdf/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run pdf

      - name: Commit PDFs
        run: |
          if git diff --quiet -- pdf/ && [ -z "$(git ls-files --others --exclude-standard pdf/)" ]; then
            echo "No PDF changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          git commit -m "chore: rebuild PDFs [skip ci]"
          git push
